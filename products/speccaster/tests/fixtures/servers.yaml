openapi: 3.0.3
info:
  title: Servers fixture
  version: 1.0.0
servers:
  - url: 'https://{env}.example.com/{basePath}/{version}'
    variables:
      env:
        default: api
      basePath:
        default: alpha
      version:
        default: v2
      optional:
        default: ''
paths:
  /ping:
    get:
      operationId: ping
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean