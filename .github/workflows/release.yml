name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - name: Install
        run: npm ci
        working-directory: products/speccaster
      - name: Test
        run: npm test
        working-directory: products/speccaster
      - name: Publish
        working-directory: products/speccaster
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
            npm publish --access public
          else
            echo "NPM_TOKEN secret not set — skipping npm publish (tests still passed)."
          fi